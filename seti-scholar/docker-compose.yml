services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seti_scholar
    ports:
      - "5432:5432"
    volumes:
      - seti_scholar_pgdata:/var/lib/postgresql/data

volumes:
  seti_scholar_pgdata:
